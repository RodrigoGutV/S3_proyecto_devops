
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Reserva de Horas Médicas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Centro Médico Salud Integral</h1>
        <p>Sistema de Reserva de Horas Médicas</p>

        <h2>Solicitud de hora médica</h2>
        <form>
            <label for="especialidad">Especialidad:</label>
            <select id="especialidad">
                <option>Medicina General</option>
                <option>Cardiología</option>
                <option>Traumatología</option>
            </select>

            <label for="fecha">Fecha de atención:</label>
            <input type="date" id="fecha">

            <button type="button">
                Simular reserva
            </button>
        </form>

        <h2>Información de atención</h2>
        <p>Lunes a viernes: 08:00 a 18:00 horas</p>
        <p>Estado del servicio: Demostración disponible</p>
        <p>Esta página no registra reservas reales.</p>
    </main>
</body>
</html>
